name: Deploy demo
# Pushes the app to a Hugging Face Space after a release is published.
# Skipped until the repository variable HF_SPACE (e.g. "gabrielkpo/fall-detection")
# and the secret HF_TOKEN (write token) are configured by the owner.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Space content
        run: |
          mkdir space
          cp -r Dockerfile requirements-serve.txt pyproject.toml src models space/
          cat > space/README.md <<'MD'
          ---
          title: Fall detection
          emoji: 🧍
          sdk: docker
          app_port: 7860
          pinned: false
          ---
          Research prototype: MediaPipe pose + 1D CNN. Source: https://github.com/gabrielkpo/Fall-detection
          MD
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
