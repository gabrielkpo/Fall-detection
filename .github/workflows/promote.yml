name: Model promotion
# Trains a candidate (any architecture), judges it once on the frozen test split and, only if
# every promotion rule passes (F1 gain proven, no recall drop, faithful ONNX, latency and size
# budgets), opens a "feat(model): promote ..." PR that the owner reviews and merges.
#
#   gh workflow run promote.yml -f arch=auto          # tournament picks the architecture
#   gh workflow run promote.yml -f arch=transformer   # force one architecture
#
# Needs (owner-managed): secret DATA_URL pointing to a PRIVATE copy of data/processed.tar.gz,
# and secret PROMOTE_TOKEN (GitHub App token or fine-grained PAT, contents + pull-requests write)
# so that the opened PR triggers the required checks. Skipped until DATA_URL exists.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Candidate architecture (auto = run the tournament first)"
        type: choice
        default: auto
        options: [auto, cnn1d, gru, tcn, transformer]
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      HAS_DATA: ${{ secrets.DATA_URL != '' }}
    steps:
      - name: Check prerequisites
        run: |
          if [ "$HAS_DATA" != "true" ]; then
            echo "DATA_URL secret not configured: nothing to do."; exit 0
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.HAS_DATA == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: env.HAS_DATA == 'true'
        with:
          python-version: "3.11"
      - name: Install and fetch data
        if: env.HAS_DATA == 'true'
        env:
          DATA_URL: ${{ secrets.DATA_URL }}
          DATA_SHA256: ${{ secrets.DATA_SHA256 }}
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch numpy scikit-learn onnx onnxruntime
          pip install -e . --no-deps
          mkdir -p data/processed
          if [ -z "$DATA_SHA256" ]; then
            echo "DATA_SHA256 secret missing: refusing to unpack an unverified archive."; exit 1
          fi
          curl -fsSL "$DATA_URL" -o data.tar.gz
          echo "$DATA_SHA256  data.tar.gz" | sha256sum -c -
          tar -xzf data.tar.gz -C data/processed
      - id: tournament
        if: env.HAS_DATA == 'true' && inputs.arch == 'auto'
        run: |
          python -m fall_detection.tournament --data data/processed --out reports/tournament
          cat reports/tournament/tournament.md >> "$GITHUB_STEP_SUMMARY"
      - id: compare
        if: env.HAS_DATA == 'true'
        env:
          ARCH: ${{ inputs.arch == 'auto' && steps.tournament.outputs.winner || inputs.arch }}
        run: |
          python -m fall_detection.promotion train --data data/processed --arch "$ARCH"
          python -m fall_detection.promotion compare --data data/processed --apply
      - name: Re-export the browser model
        if: env.HAS_DATA == 'true' && steps.compare.outputs.promote == 'true'
        run: python scripts/export_onnx.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.HAS_DATA == 'true'
        with:
          name: promotion-report
          path: reports/
      - name: Open the promotion PR
        if: env.HAS_DATA == 'true' && steps.compare.outputs.promote == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.PROMOTE_TOKEN }}
          branch: model/promote
          title: "feat(model): promote ${{ steps.compare.outputs.arch }} candidate to champion"
          commit-message: "feat(model): promote ${{ steps.compare.outputs.arch }} candidate to champion"
          body-path: reports/promotion.json
          add-paths: |
            models/champion.pth
            models/champion.json
            site/model.onnx
