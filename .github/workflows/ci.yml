name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch numpy scikit-learn fastapi httpx python-multipart onnx onnxruntime pytest ruff
          pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image (no push)
        run: docker build -f docker/Dockerfile -t fall-detection:ci .
      - name: Smoke test
        run: |
          docker run -d --name fd -p 7860:7860 fall-detection:ci
          for i in $(seq 1 30); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf localhost:7860/health
          curl -sf localhost:7860/model
