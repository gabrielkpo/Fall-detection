name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch numpy scikit-learn fastapi httpx python-multipart onnx onnxruntime pytest ruff
          pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image (no push)
        run: docker build -f docker/Dockerfile -t fall-detection:ci .
      - name: Smoke test
        run: |
          docker run -d --name fd -p 7860:7860 fall-detection:ci
          for i in $(seq 1 30); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf localhost:7860/health
          curl -sf localhost:7860/model
