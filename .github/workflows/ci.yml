name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch numpy pytest ruff
          pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
