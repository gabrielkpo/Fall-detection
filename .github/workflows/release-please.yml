name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write       # create tags and GitHub Releases
  pull-requests: write  # open and update the release PR
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A PR opened with GITHUB_TOKEN triggers no workflow, so the required checks
          # would never run on the release PR. RELEASE_PLEASE_TOKEN is a fine-grained
          # PAT (contents + pull requests: read/write on this repo only).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
