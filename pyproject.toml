[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fall-detection"
version = "0.1.0"
description = "Real-time fall detection: MediaPipe pose landmarks + 1D CNN"
requires-python = ">=3.9"
dependencies = ["numpy", "torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts"]  # legacy scripts, cleaned up in a later PR

[tool.pytest.ini_options]
testpaths = ["tests"]
